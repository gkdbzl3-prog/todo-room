# 옛 주소를 살려두기만 하는 구성. 본체는 Firebase Hosting이다.
#
# 처음엔 min_machines_running = 0으로 꺼뒀는데, 날님이 모바일에서 리다이렉트가
# 체감될 만큼 걸린다고 하셔서 상시 가동으로 바꿨다. 깨어 있을 때는 140ms고
# 지연은 전부 콜드 스타트였다. 비용을 아시고 고르신 선택이다 — 256MB
# shared-cpu-1x라 월 2달러쯤이고, 예전 구성(1GB 상시)보다는 훨씬 작다.
#
# 두 분 휴대폰이 새 주소를 저장해 fly를 거치지 않게 되면 이 앱을 지워도 된다.
# 그러면 비용도 지연도 0이 된다.
app = 'todo-room'
primary_region = 'nrt'

[http_service]
  internal_port = 8080
  force_https = true
  # 'off' = 유휴라고 머신을 멈추지 않는다. 이게 상시 가동의 핵심이고,
  # min_machines_running은 auto_stop이 켜져 있을 때만 의미가 있어 의도 기록용이다.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpus = 1
