# 옛 fly 주소(todo-room.fly.dev)로 들어온 사람을 본체(Firebase Hosting)로 보낸다.
#
# 2026-10-06에 본체를 Firebase Hosting으로 옮기고 fly 앱을 지웠는데, 휴대폰에
# 저장된 링크는 이 주소 그대로였다. 그래서 날님과 하루끝님이 엿새 동안 접속
# 자체를 못 했고, 기록이 안 쌓여 멤버 카드까지 사라졌다. 링크를 일일이 갱신
# 하라고 하는 대신 주소를 살려두는 쪽을 택했다.
#
# $request_uri를 붙여 경로와 쿼리를 그대로 넘긴다. 301이라 브라우저가 기억한다.
server {
  listen 8080;
  server_name _;

  # 상태 확인용. 리다이렉트를 타지 않아야 배포 검증에 쓸 수 있다.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 301 https://todo-room-dfb69.web.app$request_uri;
  }
}
