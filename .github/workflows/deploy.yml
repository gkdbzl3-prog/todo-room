name: Deploy

# 본체는 Firebase Hosting(https://todo-room-dfb69.web.app)이다.
# 옛 fly 주소(todo-room.fly.dev)는 deploy/fly-redirect가 301로 넘겨주기만 하며,
# 바뀌는 일이 없어서 CI가 건드리지 않는다. 손으로 고칠 때만 그 디렉터리에서
# `flyctl deploy`를 돌린다. 여기서 fly로 배포하면 그 리다이렉트를 덮어쓴다.
on:
  push:
    branches:
      - main
  # 코드 변화 없이 다시 배포해야 할 때를 위한 수동 트리거.
  # fly 앱이 사라져 재생성한 뒤처럼, 푸시할 커밋이 없는데 배포는 필요한 경우가 있다.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate deploy secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          missing=0
          for key in \
            VITE_FIREBASE_API_KEY \
            VITE_FIREBASE_AUTH_DOMAIN \
            VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_STORAGE_BUCKET \
            VITE_FIREBASE_MESSAGING_SENDER_ID \
            VITE_FIREBASE_APP_ID \
            VITE_FIREBASE_MEASUREMENT_ID
          do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Create production env file
        run: |
          cat <<EOF > .env.production
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          EOF

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # 자격증명은 둘 중 아무거나 있으면 된다.
      #   FIREBASE_SERVICE_ACCOUNT — `firebase init hosting:github`이 만드는 것. 권장.
      #   FIREBASE_TOKEN           — `firebase login:ci`가 출력하는 토큰. 더 짧지만
      #                              공식 문서에서 사용 중단 예정으로 적혀 있다.
      # 둘 다 없으면 실패시키지 않는다. 푸시마다 "run failed" 알림이 울려서
      # 날님이 괴로웠다. 대신 경고와 요약으로 눈에 띄게 남긴다.
      - name: Pick deploy credential
        id: cred
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$SA" ]; then
            echo "kind=sa" >> "$GITHUB_OUTPUT"
          elif [ -n "$TOKEN" ]; then
            echo "kind=token" >> "$GITHUB_OUTPUT"
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy (service account)
        if: steps.cred.outputs.kind == 'sa'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: todo-room-dfb69
          channelId: live

      - name: Deploy (CI token)
        if: steps.cred.outputs.kind == 'token'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx -y firebase-tools@15 deploy --only hosting --project todo-room-dfb69 --non-interactive

      - name: 배포 건너뜀 (자격증명 없음)
        if: steps.cred.outputs.kind == 'none'
        run: |
          echo "::warning::배포 안 됨 — FIREBASE_SERVICE_ACCOUNT 또는 FIREBASE_TOKEN 시크릿이 없다. 빌드만 확인했다."
          {
            echo "### ⚠️ 배포하지 않았습니다"
            echo
            echo "빌드는 통과했지만 Firebase 자격증명이 없어 올리지 못했습니다."
            echo "지금은 **손으로** 올려야 합니다:"
            echo
            echo '```'
            echo "cd ~/Projects/todo-room && pnpm build && firebase deploy --only hosting"
            echo '```'
            echo
            echo "자동 배포를 켜려면 둘 중 하나를 시크릿에 넣으세요:"
            echo "- \`FIREBASE_SERVICE_ACCOUNT\` — \`firebase init hosting:github\` (권장)"
            echo "- \`FIREBASE_TOKEN\` — \`firebase login:ci\`가 출력하는 토큰"
          } >> "$GITHUB_STEP_SUMMARY"
